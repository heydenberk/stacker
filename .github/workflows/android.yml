name: Android TV shell

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # v5 rather than v6: v6 moved caching into a separately licensed component.
      # No wrapper is committed; setup-gradle installs this Gradle and puts it on PATH.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle -p android assembleDebug --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: stacker-tv-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
